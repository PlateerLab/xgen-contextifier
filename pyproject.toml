[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xgen-contextifier"
version = "0.6.0"
description = "Convert raw documents into AI-understandable context with intelligent text extraction, table detection, and semantic chunking"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "CocoRoF", email = "gkfua00@gmail.com"},
]
maintainers = [
    {name = "CocoRoF", email = "gkfua00@gmail.com"},
]
keywords = [
    "document-processing",
    "pdf",
    "ocr",
    "text-extraction",
    "chunking",
    "ai",
    "llm",
    "langchain",
    "hwp",
    "docx",
    "xlsx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core
    "beautifulsoup4>=4.12.0",
    "chardet>=5.0.0",
    "langchain-text-splitters>=1.0.0",
    # PDF
    "pdfplumber>=0.11.0",
    "pdfminer.six>=20231228",
    "pdf2image>=1.17.0",
    # Office — DOCX / PPTX / Excel
    "lxml>=5.0",
    "python-docx>=1.1.0",
    "docx2pdf>=0.1.8",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    # HWP
    "pyhwp>=0.1b15",
    "olefile>=0.47",
    # RTF
    "striprtf>=0.0.29",
    # Image & OCR
    "pi-heif>=1.0.0",
    "pytesseract>=0.3.10",

    # ── extras 흡수 (XGEN 은 기능을 옵션으로 두지 않는다) ──────────
    # 설치 시 이름 뒤에 [tag] 를 붙여야만 켜지는 기능은, 붙이는 걸 잊은
    # 배포에서 조용히 없는 기능이 된다. XGEN 판에서는 전부 기본 포함한다.
    "langchain>=1.0.0",
    "langchain-aws>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "langgraph>=1.0.0",
    "langsmith>=0.6.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "orjson>=3.10.0",
    "psutil>=7.0.0",
    "pandas>=2.2.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
# PyMuPDF 는 AGPL-3.0 이다. 나머지 extras 는 전부 core 로 흡수했지만 이것만
# 남긴다 — 라이선스 의무가 붙는 코드를 "설치 편의"를 이유로 기본 포함할 수는
# 없다. 필요한 배포가 명시적으로 켠다.
pdf = ["pymupdf>=1.24.0"]

[project.urls]
Homepage = "https://github.com/PlateerLab/xgen-contextifier"
Documentation = "https://github.com/PlateerLab/xgen-contextifier#readme"
Repository = "https://github.com/PlateerLab/xgen-contextifier"
Issues = "https://github.com/PlateerLab/xgen-contextifier/issues"
Changelog = "https://github.com/PlateerLab/xgen-contextifier/releases"

[tool.hatch.build.targets.wheel]
packages = ["xgen_contextifier"]

[tool.hatch.build.targets.sdist]
include = [
    "xgen_contextifier/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "/.git",
    "/.venv",
    "/__pycache__",
    "*.pyc",
    "test/",
    "temp/",
    "libs/",
]
