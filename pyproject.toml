[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xgen-contextifier"
version = "0.9.0"
description = "Convert raw documents into AI-understandable context with intelligent text extraction, table detection, and semantic chunking"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "CocoRoF", email = "gkfua00@gmail.com"},
]
maintainers = [
    {name = "CocoRoF", email = "gkfua00@gmail.com"},
]
keywords = [
    "document-processing",
    "pdf",
    "ocr",
    "text-extraction",
    "chunking",
    "ai",
    "llm",
    "langchain",
    "hwp",
    "docx",
    "xlsx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core
    "beautifulsoup4>=4.12.0",
    "chardet>=5.0.0",
    "langchain-text-splitters>=1.0.0",
    # PDF
    "pdfplumber>=0.11.0",
    "pdfminer.six>=20231228",
    "pdf2image>=1.17.0",
    # Office — DOCX / PPTX / Excel
    "lxml>=5.0",
    "python-docx>=1.1.0",
    "docx2pdf>=0.1.8",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    # HWP
    "pyhwp>=0.1b15",
    "olefile>=0.47",
    # RTF
    "striprtf>=0.0.29",
    # Image & OCR
    "pi-heif>=1.0.0",
    "pytesseract>=0.3.10",

    # ── extras 흡수 (XGEN 은 기능을 옵션으로 두지 않는다) ──────────
    # 설치 시 이름 뒤에 [tag] 를 붙여야만 켜지는 기능은, 붙이는 걸 잊은
    # 배포에서 조용히 없는 기능이 된다. XGEN 판에서는 전부 기본 포함한다.
    "langchain>=1.0.0",
    "langchain-aws>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "langgraph>=1.0.0",
    "langsmith>=0.6.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "orjson>=3.10.0",
    "psutil>=7.0.0",
    "pandas>=2.2.0",
    "cachetools>=5.3.0",

    # pdf(pymupdf) 도 흡수한다. 라이선스(AGPL-3.0) 때문에 분리돼 있었으나,
    # pymupdf 는 이미 xgen-edit2docs·xgen-doc2chunk 의 core 의존이라
    # 어차피 배포 트리에 들어온다 — 여기서만 빼 두는 것은 의미가 없다.
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
# 개발·테스트 도구. 런타임 기능이 아니므로 core 에 넣지 않는다.
# pytest-asyncio 가 없으면 @pytest.mark.asyncio 가 **인식조차 되지 않아**
# async 테스트가 조용히 실패한다 (실제로 7건이 그 상태였다).
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/PlateerLab/xgen-contextifier"
Documentation = "https://github.com/PlateerLab/xgen-contextifier#readme"
Repository = "https://github.com/PlateerLab/xgen-contextifier"
Issues = "https://github.com/PlateerLab/xgen-contextifier/issues"
Changelog = "https://github.com/PlateerLab/xgen-contextifier/releases"

[tool.hatch.build.targets.wheel]
packages = ["xgen_contextifier"]

[tool.hatch.build.targets.sdist]
include = [
    "xgen_contextifier/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "/.git",
    "/.venv",
    "/__pycache__",
    "*.pyc",
    "test/",
    "temp/",
    "libs/",
]

# ---------------------------------------------------------------------------
# Ruff — 규칙 집합을 고정해 `ruff check` 가 ruff 버전에 따라 흔들리지 않게 한다
# (새로 설치되는 CI 는 그냥 두면 표류한다). 레이아웃은 포매터가 소유하므로
# E501(줄 길이)은 여기서 제외.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
# 레이아웃은 포매터가 소유한다 — E501 을 켜 두면 포매터가 못 줄이는 줄
# (긴 URL·문자열)까지 오류로 잡혀 게이트가 영구히 빨간 상태가 된다.
# 위 주석이 "E501 제외"라고 적혀 있었는데 설정이 그렇지 않아 81건이 떠 있었다.
ignore = ["E501"]
